[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gig-cli"
version = "1.0.0"
description = "GitIgnore Generator CLI - generate .gitignore files for any language, fast and offline"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "shadow1t" }]
keywords = ["gitignore", "cli", "git", "developer-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
gig = "gig.cli:main"

[tool.setuptools.packages.find]
include = ["gig*"]

[tool.setuptools.package-data]
gig = ["templates/*.gitignore"]
